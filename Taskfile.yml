# Task runner do site da Calu (https://taskfile.dev).
# Wrappers finos sobre os scripts do pnpm, para que o dia a dia e a Definition of Done estejam
# a um `task <nome>` de distância. Node/pnpm/task são pinados no mise.toml — rode `mise install`
# uma vez, depois `task --list`.
version: '3'

tasks:
  default:
    desc: Lista as tasks disponíveis
    cmds:
      - task --list

  install:
    desc: Instala as dependências a partir do lockfile congelado
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    desc: Sobe o servidor de desenvolvimento do Astro
    cmds:
      - pnpm dev

  dev:stop:
    desc: Derruba o servidor de desenvolvimento (o Astro o mantém em background)
    cmds:
      - pnpm exec astro dev stop

  build:
    desc: Gera o site de produção em dist/
    cmds:
      - pnpm build

  preview:
    desc: Serve o build de produção localmente
    cmds:
      - pnpm preview

  preview:stop:
    desc: Derruba o servidor de preview (o Astro o mantém em background)
    cmds:
      - pnpm exec astro preview stop

  stop:
    desc: Derruba os servidores de dev e de preview
    cmds:
      - task: dev:stop
      - task: preview:stop

  typecheck:
    desc: Checagem de tipos de Astro + TypeScript (astro check)
    cmds:
      - pnpm typecheck

  lint:
    desc: Roda o ESLint
    cmds:
      - pnpm lint

  lint:fix:
    desc: Roda o ESLint corrigindo o que for automático
    cmds:
      - pnpm lint:fix

  fmt:
    desc: Formata o repositório inteiro com o Prettier
    cmds:
      - pnpm format

  fmt:check:
    desc: Verifica a formatação sem escrever (somente leitura)
    cmds:
      - pnpm format:check

  check:styles:
    desc: Reprova arbitrary value e classe que não gera CSS
    cmds:
      - pnpm check:styles

  check:
    desc: Todos os gates de qualidade — typecheck + lint + verificação de formatação + estilos
    cmds:
      - task: typecheck
      - task: lint
      - task: fmt:check
      - task: check:styles

  test:
    desc: Roda a suíte de testes (Vitest)
    deps:
      - build
    cmds:
      - pnpm test

  # `astro preview` DAEMONIZA — imprime o pid e RETORNA, com o servidor no ar. Foi por isso que o
  # `webServer` do Playwright ficou de fora do `playwright.config.ts`: ele trata um comando que
  # retorna como servidor que morreu. O ciclo de vida mora aqui, e o `defer` garante que o servidor
  # caia mesmo quando a medição reprova.
  test:metrics:
    desc: Mede o site RENDERIZADO num navegador (Playwright sobre o dist/)
    deps:
      - build
    cmds:
      - pnpm exec astro preview --port 4321
      - defer: pnpm exec astro preview stop
      - pnpm exec playwright test {{.CLI_ARGS}}

  browsers:
    desc: Baixa o Chromium que a medição usa (uma vez por máquina)
    cmds:
      - pnpm exec playwright install chromium

  dod:
    desc: Definition of Done — formata, roda os gates, builda, testa e mede (rode antes de commitar)
    cmds:
      - task: fmt
      - task: check
      - task: build
      - task: test
      - task: test:metrics

  # O ALVO DO CI, e ele existe por um motivo só: `dod` COMEÇA com `fmt`, que ESCREVE. CI não
  # reformata o repositório de ninguém — ele reprova quando a formatação está errada, e isso quem
  # faz é o `fmt:check` que já está dentro de `check`.
  #
  # Fora essa diferença, é deliberadamente UM alvo, pelo mesmo motivo escrito no `.githooks/pre-commit`
  # sobre o `task check`: com um alvo só, o gate do CI não tem como divergir do gate local quando
  # um check novo entrar.
  ci:
    desc: O gate completo, sem escrever nada — é isto que o GitHub Actions roda
    cmds:
      - task: check
      - task: build
      - task: test
      - task: test:metrics

  hooks:install:
    desc: Ativa o diretório .githooks/ versionado (gate de DOD no pre-commit)
    cmds:
      - git config core.hooksPath .githooks
      - echo "✓ git hooks ativados (.githooks/). Pule uma vez com 'git commit --no-verify'."

  hooks:uninstall:
    desc: Volta para o diretório padrão .git/hooks/ do Git
    cmds:
      - git config --unset core.hooksPath
      - echo "✓ git hooks desativados (de volta para .git/hooks/)."
